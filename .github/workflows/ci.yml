name: Foundation checks
on:
  push:
    branches: [main, 'improvement/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-aircraft.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-aircraft.txt
      - name: Run Docker-free Python test suite
        run: pytest -q -m 'not integration'

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ucas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ucas_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-prod.txt
            requirements-aircraft.txt
      - name: Install integration dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-prod.txt -r requirements-aircraft.txt
      - name: Apply PostgreSQL migrations
        env:
          UCAS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ucas_test
        run: python services/management-api/migrate.py
      - name: Run PostgreSQL integration suite
        env:
          UCAS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ucas_test
        run: pytest -q -m integration

  management-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/management-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/management-web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test fleet explorer utilities
        run: pnpm test
      - name: Typecheck management UI
        run: pnpm typecheck
      - name: Build management UI
        run: pnpm build
